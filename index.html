<!DOCTYPE html>
<html>
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LED方向幕シミュレーター</title>
	<link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="leaflet/leaflet.css">
    </head>

	<script>
	if ("serviceWorker" in navigator) {
	    window.addEventListener("load", () => {
	        navigator.serviceWorker.register("./sw.js");
	    });
	}
	</script>

    <body>

		<div id="loading" hidden>
			<span>Loading</span><span class="loadingDots"></span>
		</div>

    	<header id="tittle">
        	<h1 class="scroll-fade-title">LED方向幕シミュレーター</h1>
    	</header>

		<!-- ホーム画面（車両選択画面） -->
		<div id="vehicleSelector">

			<button id="messageBoardBtn">電光掲示板を表示</button>
			<label id="vehicleSelectMethodLabel" for="vehicleSelectMethod">車両の選択方法</label>
			<select id="vehicleSelectMethod">
				<option value="list">リストから選択</option>
				<option value="prefecture">都道府県から選択</option>
				<option value="company">会社から選択</option>
				<option value="grid" hidden>地図上から選択</option>
			</select>
			<div id="vehicleSearchArea">
				<input
					type="search"
					id="vehicleSearchInput"
					placeholder="🔍車両名で検索"
					autocomplete="off"
				>
				<div id="vehicleSearchResults"></div>
			</div>
			<div id="vehicleSelect" class="selectGroup"></div>
			<div id="map" hidden>
				<div id="linePanel" hidden>
					<button id="closeLinePanel">×</button>
					<h2 id="selectedLineName"></h2>

					<div id="lineVehicleList"></div>
				</div>
			</div>
			<div id="vehiclePrefectureSearchArea" hidden>
			    <input
			        type="search"
			        id="vehiclePrefectureSearchInput"
			        placeholder="🔍車両名・都道府県名で検索"
			        autocomplete="off"
			    >
			    <div id="vehiclePrefectureSearchResults"></div>
			</div>

			<!-- 会社検索 -->
			<div id="vehicleCompanySearchArea" hidden>
			    <input
			        type="search"
			        id="vehicleCompanySearchInput"
			        placeholder="🔍会社名で検索"
			        autocomplete="off"
			    >
			    <div id="vehicleCompanySearchResults"></div>
			</div>
			<div id="prefectureList" hidden></div>
			<div id="companyList" hidden></div>
		</div>
		<div id="cacheNotice" hidden>
    キャッシュの保存が完了しました
		</div>

		<!-- シミュレーター画面 -->
		<div id="simulator" hidden>
			<div class="container">
				<aside id="sidebar">
					<div id="setTime">
						<div id="jaTime" class="timeSetting" hidden>
							<span>日本語:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="3" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="enTime" class="timeSetting" hidden>
							<span>英語:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="infoTime" class="timeSetting" hidden>
							<span>案内:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
						<div id="carNumberTime" class="timeSetting" hidden>
							<span>号車:</span>
							<div class="numberInput">
								<button type="button" class="minus">−</button>
								<input type="number" value="2" min="0.1" step="0.1">
								<button type="button" class="plus">＋</button>
							</div>
							<span>秒</span>
						</div>
					</div>
					
					<div id="buttonGroup">
						<div id="typeGroup">
							<label id="type" class="displayLabel">種別:なし</label>
							<div id="typeButtons" class="buttonGroup"></div>
						</div>
						<div id="destinationGroup">
							<label id="destination" class="displayLabel">行先:なし</label>
							<div id="destinationButtons" class="buttonGroup"></div>
						</div>
						<div id="informationGroup">
							<label id="information" class="displayLabel">案内:なし</label>
							<div id="informationButtons" class="buttonGroup"></div>
						</div>
						<div id="information2Group">
							<label id="information2" class="displayLabel">案内2:なし</label>
							<div id="information2Buttons" class="buttonGroup"></div>
						</div>
						<div id="lineGroup">
							<label id="line" class="displayLabel">路線名:なし</label>
							<div id="lineButtons" class="buttonGroup"></div>
						</div>
						<div id="nextModeGroup">
							<label id="nextMode" class="displayLabel">次駅:なし</label>
							<div id="nextModeButtons" class="buttonGroup"></div>
						</div>
						<div id="carNumberGroup">
							<label id="carNumber" class="displayLabel">号車:なし</label>
							<div id="carNumberButtons" class="buttonGroup"></div>
						</div>
					</div>

					<div id="verticalSlide">
						<button id="displayVerticalSlideBtn">縦スライド設定を表示する</button>
						<div id="verticalSlideCheckbox" hidden>
							<label id="verticalSlideLabel1">
								<input type="checkbox" id="verticalSlideCheck" checked> 画面切替時に縦スライドする
							</label>
							<label id="verticalSlideLabel2">
								<input type="checkbox" id="verticalSlideCheck2" checked> 画面切替時に縦スライドする（2）
							</label>
							<label id="choppyScrollLabel">
								<input type="checkbox" id="choppyScrollCheck"> スクロールをカクカクさせる
							</label>
						</div>
					</div>
					<div id="animation" hidden>
						<label>
							<input type="checkbox" id="animationCheck">
							NEXアニメーションを表示
						</label>
					</div>
					<div id="ledAgingGroup">
						<label id="ledAgingLabel">
							<input type="checkbox" id="ledAgingCheck"> LEDを劣化させる
						</label>
						<div id="setLedAgingLebel" hidden>
							<label id="ledAgingLebelLabel" for="ledAgingLebel">LEDの劣化度合い: <span id="ledAgingLebelValue">3</span></label>
							<input type="range" id="ledAgingLebel" min="1" max="7" value="3" step="1">
						</div>
					</div>
					
					<div id="scroll" hidden>
						<label>
							<input type="checkbox" id="scrollCheck">
							スクロール
						</label>
						<textarea id="scrollText" hidden></textarea>
						<h2 id="scrollStatusLabel" hidden>スクロール文字対応状況</h2>
						<div id="scrollPreview" hidden></div>
						<h3 id="scrollPreviewLabel" hidden><span style="color: red; font-weight: bold;">赤文字</span>：未対応　黒文字：対応</h3>
						<button id="startScrollBtn" hidden>スクロール更新</button>
					</div>

					<div id="explanation" hidden>
						<h2>車両説明</h2>
						<div id="explanationLabel"></div>
					</div>
					
					<div id="referenceSite" hidden>
						<h2>参考サイト</h2>
						<label>一部の再現ドットは、以下のサイトに掲載されている再現画像を参考にドット打ちさせていただきました。</label>
						<div id="referenceSiteLink"></div>
					</div>

					<button id="vehicleSelectButton" class="backVehicleSelector">車両選択に戻る</button>
					<button id="displayLog" hidden>ログを表示</button>
				</aside>

				<div id="resizer"></div>

				<main>
					<div class="ledFrame">
						<canvas id="led" width="895" height="223"></canvas>
					</div>
				</main>
        	</div>
		</div>
		<div id="messageBoard" hidden>
			<aside id="messageBoardSidebar">
				<label id="timeCheckLabel">
					<input type="checkbox" id="timeCheck">
					現在時刻を表示
				</label>
				<div id="messageBoardScroll">
					<label>
						<input type="checkbox" id="messageBoardScrollCheck">
						スクロール
					</label>
					<textarea id="messageBoardScrollText" hidden></textarea>
					<button id="startMessageBoardScrollBtn" hidden>スクロール更新</button>
				</div>
				<button id="messageBoardVehicleSelectButton" class="backVehicleSelector">車両選択に戻る</button>
			</aside>
			<main>
				<div class="ledFrame">
					<canvas id="messageBoardLedPreview"></canvas>
				</div>
			</main>
		</div>

        <footer id="status">
        </footer>
		<div id="debugConsole" hidden>
			<div>デバッグコンソール</div>
			<button onclick="document.getElementById('debugLog').textContent = ''">ログを消去</button>
			<pre id="debugLog"></pre>
		</div>

	<script src="js/state.js"></script>
	<script src="js/constants.js"></script>
	<script src="js/dom.js"></script>
	<script src="js/json.js"></script>
	<script src="js/buttons.js"></script>
	<script src="js/display.js"></script>
	<script src="js/render.js"></script>
	<script src="js/vehicle.js"></script>
    <script src="js/script.js"></script>
	<script src="leaflet/leaflet.js"></script>
	<script src="js/map.js"></script>
    </body>
</html>
